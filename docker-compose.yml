services:
  nyangvil-backend:
    build: .
    image: nyangvil-backend
    container_name: nyangvil-container
    restart: unless-stopped
    ports:
      - "${NYANGVIL_DEV_TOMCAT_PORT:-8099}:${NYANGVIL_DEV_TOMCAT_PORT:-8099}"
    environment:
      - NYANGVIL_SPRING_PROFILE_ACTIVE=${NYANGVIL_SPRING_PROFILE_ACTIVE}
      - NYANGVIL_DEV_TOMCAT_PORT=${NYANGVIL_DEV_TOMCAT_PORT}
      - NYANGVIL_DEV_JWT_SECRET=${NYANGVIL_DEV_JWT_SECRET}
      - NYANGVIL_DEV_JWT_EXPIRATION=${NYANGVIL_DEV_JWT_EXPIRATION}
      - NYANGVIL_DEV_DB_URL=${NYANGVIL_DEV_DB_URL}
      - NYANGVIL_DEV_DB_USERNAME=${NYANGVIL_DEV_DB_USERNAME}
      - NYANGVIL_DEV_DB_PASSWORD=${NYANGVIL_DEV_DB_PASSWORD}
      - NYANGVIL_DEV_DB_NAME=${NYANGVIL_DEV_DB_NAME}
      - NYANGVIL_DEV_MAIL_USERNAME=${NYANGVIL_DEV_MAIL_USERNAME}
      - NYANGVIL_DEV_MAIL_PASSWORD=${NYANGVIL_DEV_MAIL_PASSWORD}
      - NYANGVIL_DEV_SOLAPI_API_KEY=${NYANGVIL_DEV_SOLAPI_API_KEY}
      - NYANGVIL_DEV_SOLAPI_API_SECRET=${NYANGVIL_DEV_SOLAPI_API_SECRET}
      - NYANGVIL_DEV_SOLAPI_SENDER_PHONE=${NYANGVIL_DEV_SOLAPI_SENDER_PHONE}
      - TZ=Asia/Seoul
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nyangvil-backend.rule=Host(`nyang.matchhub.co.kr`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/uploads`) || PathPrefix(`/actuator`))"
      - "traefik.http.routers.nyangvil-backend.entrypoints=websecure"
      - "traefik.http.routers.nyangvil-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nyangvil-backend.priority=100"
      - "traefik.http.services.nyangvil-backend.loadbalancer.server.port=${NYANGVIL_DEV_TOMCAT_PORT:-8099}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${NYANGVIL_DEV_TOMCAT_PORT:-8099}/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  nyangvil-frontend:
    build: ./frontend
    image: nyangvil-frontend
    container_name: nyangvil-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    networks:
      - infra-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nyangvil-frontend.rule=Host(`nyang.matchhub.co.kr`)"
      - "traefik.http.routers.nyangvil-frontend.entrypoints=websecure"
      - "traefik.http.routers.nyangvil-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nyangvil-frontend.priority=10"
      - "traefik.http.services.nyangvil-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      nyangvil-backend:
        condition: service_healthy

networks:
  infra-net:
    external: true
